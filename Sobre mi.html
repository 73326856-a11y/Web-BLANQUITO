<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Mí - Gamaliel Jordi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- ESTILO GENERAL Y FONDO ELEGANTE --- */
        :root {
            --accent-color: #4ecca3; /* Verde Neón Elegante */
            --bg-gradient: radial-gradient(circle at top right, #1a1a2e, #16213e, #0a0a12);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --text-bright: #ffffff;
            --text-dim: #bdc3c7;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-bright);
            display: flex;
            justify-content: center;
        }

        .sobre-mi {
            max-width: 1000px;
            width: 90%;
            padding: 80px 20px;
            text-align: center;
        }

        /* --- TÍTULOS --- */
        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            letter-spacing: 10px;
            color: transparent;
            -webkit-text-stroke: 1px var(--accent-color);
            margin-bottom: 60px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 10px rgba(78, 204, 163, 0.3));
        }

        h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
            letter-spacing: 4px;
            margin: 40px 0 20px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }

        h2::after {
            content: '';
            position: absolute;
            width: 50%;
            height: 2px;
            background: var(--accent-color);
            bottom: -5px;
            left: 25%;
        }

        /* --- ICONO DE PERFIL --- */
        .perfil-icono {
            font-size: 70px;
            color: var(--text-bright);
            background: var(--glass-bg);
            width: 140px;
            height: 140px;
            line-height: 140px;
            margin: 0 auto 30px;
            border-radius: 50%;
            border: 1px solid rgba(78, 204, 163, 0.4);
            box-shadow: 0 0 30px rgba(78, 204, 163, 0.2);
            backdrop-filter: blur(5px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .perfil-icono:hover {
            transform: scale(1.1) rotate(10deg);
            background: rgba(78, 204, 163, 0.15);
            border-color: var(--accent-color);
            box-shadow: 0 0 40px rgba(78, 204, 163, 0.5);
        }

        /* --- SECCIÓN DE DATOS (GLASSMORPHISM) --- */
        .datos {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            margin-top: 20px;
        }

        .datos p {
            margin: 0;
            font-size: 1rem;
            color: var(--text-dim);
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            transition: 0.3s;
        }

        .datos p:hover {
            background: rgba(78, 204, 163, 0.05);
            transform: translateX(5px);
        }

        .datos p strong {
            color: var(--accent-color);
            margin-right: 12px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        /* --- PORTAFOLIO / PROYECTOS --- */
        .portafolio {
            margin-top: 60px;
        }

        .proyectos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .proyecto {
            background: rgba(255, 255, 255, 0.03);
            padding: 40px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-bright);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .proyecto::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(78, 204, 163, 0.2), transparent);
            transition: 0.5s;
        }

        .proyecto:hover::before {
            left: 100%;
        }

        .proyecto:hover {
            background: rgba(78, 204, 163, 0.1);
            border-color: var(--accent-color);
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: var(--accent-color);
        }

        /* --- RESPONSIVIDAD --- */
        @media (max-width: 768px) {
            .datos { grid-template-columns: 1fr; padding: 25px; }
            h1 { font-size: 2.8rem; letter-spacing: 5px; }
            .proyectos { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<section class="sobre-mi">

    <h1>SOBRE MÍ</h1>

    <h2>PERFIL</h2>

    <div class="perfil-icono">
        <i class="fas fa-user"></i>
    </div>

    <h2>DESCRIPCIÓN</h2>

    <div class="datos">
        <p><strong>Apellidos:</strong> BLANCO HUAQUI</p>
        <p><strong>Nombres:</strong> Gamaniel Jordi</p>
        <p><strong>Edad:</strong> 21</p>
        <p><strong>Sexo:</strong> M</p>
        <p><strong>Programa:</strong> Arquitectura de Plataformas de STI</p>
        <p><strong>Dirección:</strong> C.P de Antapirca</p>
        <p><strong>Email:</strong> 73326856@idexpasco.edu.pe</p>
    </div>

    <div class="portafolio">
        <h2>PORTAFOLIOS</h2>

        <div class="proyectos">
            <div class="proyecto">Proyecto 1</div>
            <div class="proyecto">Proyecto 2</div>
            <div class="proyecto">Proyecto 3</div>
            <div class="proyecto">Proyecto 4</div>
            <div class="proyecto">Proyecto 5</div>
            <div class="proyecto">Proyecto 6</div>
        </div>
    </div>

</section>

</body>
</html>
